group = 'com.ashy0019'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.named('processResources') {
	filesMatching('hapticscape-version.properties') {
		expand(appVersion: appVersion.get())
	}
}

// RuneLite bridge development host. Start runStandalone first.
tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}

tasks.register('standaloneJar', Jar) {
	dependsOn tasks.named('classes')
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes(
			'Main-Class': desktopMainClass,
			'Multi-Release': true,
			'Implementation-Title': 'HapticScape Desktop',
			'Implementation-Version': appVersion.get()
		)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from(sourceSets.main.output) {
		// RuneLite is a separate event source now. None of its bootstrap, config,
		// plugin, or adapter classes belong in the desktop application.
		exclude 'com/ashy0019/hapticscape/HapticScapeClient*.class'
		exclude 'com/ashy0019/hapticscape/HapticScapePlugin*.class'
		exclude 'com/ashy0019/hapticscape/HapticScapeConfig*.class'
		exclude 'com/ashy0019/hapticscape/integration/runelite/**'
	}
	from {
		standaloneRuntimeFiles().collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('desktop')
	archiveFileName.set('hapticscape-desktop.jar')
}

tasks.register('bridgeJar', Jar) {
	dependsOn tasks.named('classes')
	manifest {
		attributes(
			'Implementation-Title': 'HapticScape RuneLite Bridge',
			'Implementation-Version': appVersion.get()
		)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from(sourceSets.main.output) {
		include bridgeClassIncludes
	}
	from(layout.projectDirectory.file('runelite-plugin.properties'))

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('bridge')
	archiveFileName.set('hapticscape-runelite-bridge.jar')
}

tasks.register('runStandalone', JavaExec) {
	dependsOn tasks.named('standaloneJar')
	classpath = files(tasks.named('standaloneJar').flatMap { it.archiveFile })
	mainClass = desktopMainClass
	jvmArgs "-ea"
}

tasks.register('verifyStandaloneJar') {
	dependsOn tasks.named('standaloneJar')

	doLast {
		def jarFile = tasks.named('standaloneJar').get().archiveFile.get().asFile
		def hasLauncher = false
		def hasVersionResource = false
		def forbiddenEntries = []
		def runeLiteReferences = []

		zipTree(jarFile).visit { details ->
			if (details.directory) {
				return
			}

			def path = details.relativePath.pathString
			if (path == 'com/ashy0019/hapticscape/desktop/HapticScapeDesktopMain.class') {
				hasLauncher = true
			}
			if (path == 'hapticscape-version.properties') {
				hasVersionResource = true
			}
			if (path.startsWith('net/runelite/')
				|| path.startsWith('com/ashy0019/hapticscape/integration/runelite/')
				|| path.startsWith('com/ashy0019/hapticscape/HapticScapePlugin')
				|| path.startsWith('com/ashy0019/hapticscape/HapticScapeClient')
				|| path.startsWith('com/ashy0019/hapticscape/HapticScapeConfig')
				|| path.startsWith('org/junit/')
				|| path.startsWith('org/hamcrest/')
				|| (path.startsWith('com/ashy0019/hapticscape/') && path.endsWith('Test.class'))) {
				forbiddenEntries.add(path)
			}

			if (path.startsWith('com/ashy0019/hapticscape/') && path.endsWith('.class')) {
				def classBytes = new String(details.file.bytes, 'ISO-8859-1')
				if (classBytes.contains('net/runelite/')) {
					runeLiteReferences.add(path)
				}
			}
		}

		if (!hasLauncher) {
			throw new GradleException('The standalone desktop launcher class is missing.')
		}
		if (!hasVersionResource) {
			throw new GradleException('The standalone version metadata is missing.')
		}
		if (!forbiddenEntries.isEmpty()) {
			throw new GradleException(
				"RuneLite/test code leaked into the standalone JAR: ${forbiddenEntries.sort().join(', ')}"
			)
		}
		if (!runeLiteReferences.isEmpty()) {
			throw new GradleException(
				"Standalone HapticScape classes still reference RuneLite: ${runeLiteReferences.sort().join(', ')}"
			)
		}
	}
}

tasks.register('verifyBridgeJar') {
	dependsOn tasks.named('bridgeJar')

	doLast {
		def jarFile = tasks.named('bridgeJar').get().archiveFile.get().asFile
		def hasPlugin = false
		def hasPluginMetadata = false
		def forbiddenEntries = []

		zipTree(jarFile).visit { details ->
			if (details.directory) {
				return
			}

			def path = details.relativePath.pathString
			if (path == 'com/ashy0019/hapticscape/HapticScapePlugin.class') {
				hasPlugin = true
			}
			if (path == 'runelite-plugin.properties') {
				hasPluginMetadata = true
			}
			if (path.startsWith('net/runelite/')
				|| path.startsWith('com/google/')
				|| path.startsWith('org/slf4j/')
				|| path.startsWith('ch/qos/logback/')
				|| path.startsWith('okhttp3/')
				|| path.startsWith('okio/')
				|| path.startsWith('com/sun/jna/')
				|| path.startsWith('com/ashy0019/hapticscape/desktop/')
				|| path.startsWith('com/ashy0019/hapticscape/integration/desktop/')
				|| path.startsWith('com/ashy0019/hapticscape/device/')
				|| path.startsWith('com/ashy0019/hapticscape/music/')
				|| path.startsWith('com/ashy0019/hapticscape/remote/')
				|| path.startsWith('com/ashy0019/hapticscape/ui/')
				|| path.startsWith('org/junit/')
				|| path.startsWith('org/hamcrest/')
				|| path.endsWith('Test.class')) {
				forbiddenEntries.add(path)
			}
		}

		if (!hasPlugin) {
			throw new GradleException('The RuneLite bridge plugin class is missing.')
		}
		if (!hasPluginMetadata) {
			throw new GradleException('runelite-plugin.properties is missing from the bridge JAR.')
		}
		if (!forbiddenEntries.isEmpty()) {
			throw new GradleException(
				"Standalone or shaded dependency code leaked into the bridge JAR: ${forbiddenEntries.sort().join(', ')}"
			)
		}
	}
}

tasks.register('verifySplitArtifacts') {
	dependsOn tasks.named('verifyStandaloneJar')
	dependsOn tasks.named('verifyBridgeJar')
}

// Keep every ordinary test run enforcing the artifact boundary as well.
tasks.named('test') {
	dependsOn tasks.named('verifySplitArtifacts')
}

// Legacy combined client JAR retained only until the Windows packaging script
// is migrated to the standalone artifact in Phase 4B.
tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from {
		packagedRuntimeFiles().collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("hapticscape-client.jar")
}

tasks.register('verifyClientJar') {
	dependsOn tasks.named('shadowJar')

	doLast {
		def clientJar = tasks.named('shadowJar').get().archiveFile.get().asFile
		def forbiddenEntries = []
		def hasLauncher = false
		def hasStandaloneLauncher = false
		def hasVersionResource = false

		zipTree(clientJar).visit { details ->
			if (details.directory) {
				return
			}

			def path = details.relativePath.pathString
			if (path == 'com/ashy0019/hapticscape/HapticScapeClient.class') {
				hasLauncher = true
			}
			if (path == 'com/ashy0019/hapticscape/desktop/HapticScapeDesktopMain.class') {
				hasStandaloneLauncher = true
			}
			if (path == 'hapticscape-version.properties') {
				hasVersionResource = true
			}
			if (path.startsWith('org/junit/') ||
				path.startsWith('org/hamcrest/') ||
				(path.startsWith('com/ashy0019/hapticscape/') && path.endsWith('Test.class'))) {
				forbiddenEntries.add(path)
			}
		}

		if (!hasLauncher) {
			throw new GradleException('The packaged client launcher class is missing.')
		}
		if (!hasStandaloneLauncher) {
			throw new GradleException('The standalone desktop launcher class is missing.')
		}
		if (!hasVersionResource) {
			throw new GradleException('The packaged client version metadata is missing.')
		}
		if (!forbiddenEntries.isEmpty()) {
			throw new GradleException("Test code leaked into the packaged client: ${forbiddenEntries.join(', ')}")
		}
	}
}

tasks.register('collectRuntimeLicenses') {
	dependsOn configurations.testRuntimeClasspath
	inputs.files(configurations.testRuntimeClasspath)
	outputs.dir(layout.buildDirectory.dir('generated/runtime-licenses'))

	doLast {
		def outputDirectory = layout.buildDirectory.dir('generated/runtime-licenses').get().asFile
		delete outputDirectory
		outputDirectory.mkdirs()

		def artifacts = packagedRuntimeArtifacts().sort {
			left, right ->
			"${left.moduleVersion.id.group}:${left.name}:${left.moduleVersion.id.version}:${left.classifier ?: ''}" <=>
				"${right.moduleVersion.id.group}:${right.name}:${right.moduleVersion.id.version}:${right.classifier ?: ''}"
		}
		def unexpectedModules = artifacts.collect {
			"${it.moduleVersion.id.group}:${it.name}".toString()
		}.toSet().findAll { !approvedRuntimeModules.contains(it) }
		if (!unexpectedModules.isEmpty()) {
			throw new GradleException(
				"The runtime contains dependencies that have not been reviewed for redistribution: ${unexpectedModules.sort().join(', ')}"
			)
		}
		def inventory = []

		artifacts.each { artifact ->
			def classifierSuffix = artifact.classifier ? ":${artifact.classifier}" : ''
			def coordinate = "${artifact.moduleVersion.id.group}:${artifact.name}:${artifact.moduleVersion.id.version}${classifierSuffix}"
			def artifactDirectoryName = coordinate.replaceAll('[^A-Za-z0-9._-]', '_')
			def artifactDirectory = new File(outputDirectory, artifactDirectoryName)
			def discoveredNotices = []

			zipTree(artifact.file).visit { details ->
				if (details.directory) {
					return
				}

				def path = details.relativePath.pathString
				def fileName = path.tokenize('/').last()
				if (fileName ==~ /(?i)(LICENSE|NOTICE|COPYING|COPYRIGHT)([._-].*)?/) {
					artifactDirectory.mkdirs()
					def destinationName = path.replaceAll('[^A-Za-z0-9._-]', '_')
					new File(artifactDirectory, destinationName).bytes = details.file.bytes
					discoveredNotices.add(path)
				}
			}

			def status = discoveredNotices.isEmpty()
				? 'no embedded notice; covered by the curated notices supplied with HapticScape'
				: "embedded: ${discoveredNotices.sort().join(', ')}"
			inventory.add("${coordinate} -- ${status}")
		}

		new File(outputDirectory, 'RESOLVED-DEPENDENCIES.txt').setText(
			inventory.join(System.lineSeparator()) + System.lineSeparator(),
			'UTF-8'
		)
	}
}
