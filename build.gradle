	'com/ashy0019/hapticscape/HapticScapePlugin*.class',
	'com/ashy0019/hapticscape/GameplayEventSink*.class',
	'com/ashy0019/hapticscape/SkillIds*.class',
	'com/ashy0019/hapticscape/event/**',
	'com/ashy0019/hapticscape/integration/runelite/RuneLiteChatEventAdapter*.class',
	'com/ashy0019/hapticscape/integration/runelite/RuneLiteGameplayBridge*.class',
	'com/ashy0019/hapticscape/integration/runelite/RuneLiteInventoryEventAdapter*.class',
	'com/ashy0019/hapticscape/integration/runelite/RuneLiteLootEventAdapter*.class',
	'com/ashy0019/hapticscape/integration/runelite/RuneLiteNotificationEventAdapter*.class',
	'com/ashy0019/hapticscape/integration/runelite/RuneLitePlayerDeathEventAdapter*.class',
	'com/ashy0019/hapticscape/integration/runelite/RuneLiteToxicStatusEventAdapter*.class',
	'com/ashy0019/hapticscape/integration/runelite/RuneLiteVitalsEventAdapter*.class',
	'com/ashy0019/hapticscape/integration/runelite/RuneLiteXpEventAdapter*.class',
	'com/ashy0019/hapticscape/protocol/EventEnvelope*.class',
	'com/ashy0019/hapticscape/protocol/EventProtocol*.class',
	'com/ashy0019/hapticscape/protocol/EventWireCodec*.class',
	'com/ashy0019/hapticscape/protocol/LocalhostFrameIo*.class',
	'com/ashy0019/hapticscape/protocol/LocalhostGameplayEventTransport*.class',
