name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Test and verify client
    runs-on: ubuntu-latest

    steps:
      - name: Check out HapticScape
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Run compatibility checks
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew

          ./gradlew \
            --no-daemon \
            clean \
            test \
            verifyClientJar \
            collectRuntimeLicenses
