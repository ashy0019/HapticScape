name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and verify standalone
    runs-on: ubuntu-latest

    steps:
      - name: Check out HapticScape
        uses: actions/checkout@v6

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test remote relay
        working-directory: remote-relay
        run: npm test

      - name: Run compatibility checks
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew \
            --no-daemon \
            clean \
            test \
            verifyStandaloneArtifact \
            collectRuntimeLicenses \
            :runelite-bridge-client:test \
            :runelite-bridge-client:verifyBridgeClientJar \
            :runelite-bridge-client:collectRuntimeLicenses

      - name: Upload standalone desktop JAR
        uses: actions/upload-artifact@v4
        with:
          name: hapticscape-desktop-${{ github.sha }}
          path: build/libs/hapticscape-desktop.jar
          retention-days: 14


      - name: Upload fallback RuneLite bridge client JAR
        uses: actions/upload-artifact@v4
        with:
          name: hapticscape-runelite-bridge-client-${{ github.sha }}
          path: runelite-bridge-client/build/libs/hapticscape-runelite-bridge-client.jar
          retention-days: 14
